name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  harness:
    name: harness (agent + gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # TrueForge needs 22.14+; the CLIs run TypeScript directly via
          # --experimental-strip-types rather than compiling first.
          node-version: '22.14'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The perimeter is the one control that protects the other controls, so
      # it is asserted rather than trusted. These are paths inside the TARGET
      # repository (R3108/cart-service): the CI that verifies the agent's own
      # patch, and the dependency manifests. If a pull request ever widens
      # LTP_WRITE_PATHS far enough to hand those back, this step fails before a
      # human reviews the diff - which is the point: the change that removes a
      # boundary is exactly the change nobody reads carefully. The harness
      # itself is protected one layer earlier: loadConfig refuses a target that
      # IS the harness, asserted in src/__tests__/config.test.ts.
      - name: Perimeter holds against the target's sensitive paths
        env:
          LTP_WRITE_PATHS: src/**,!.github/**,!package.json,!package-lock.json
        run: |
          npm run perimeter -- --expect-blocked \
            .github/workflows/ci.yml \
            package.json \
            package-lock.json \
            src/../.github/workflows/ci.yml \
            src/../package.json
          npm run perimeter -- --expect-allowed \
            src/cart.js \
            src/cart.test.js

  # The service under repair lives in its own repository (R3108/cart-service);
  # its suite runs on its own pull requests, not here.
