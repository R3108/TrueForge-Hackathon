name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  harness:
    name: harness (agent + gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # TrueForge needs 22.14+; the CLIs run TypeScript directly via
          # --experimental-strip-types rather than compiling first.
          node-version: '22.14'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The perimeter is the one control that protects the other controls, so
      # it is asserted rather than trusted. If a pull request ever widens
      # LTP_WRITE_PATHS far enough for the agent to reach its own approval gate,
      # this step fails before a human reviews the diff - which is the point:
      # the change that removes the boundary is exactly the change nobody reads
      # carefully.
      - name: Perimeter holds against the control plane
        env:
          LTP_WRITE_PATHS: fixture/**,!fixture/.github/**
        run: |
          npm run perimeter -- --expect-blocked \
            src/agent/spec.ts \
            src/runtime/approvals.ts \
            src/runtime/perimeter.ts \
            src/runtime/secrets.ts \
            package.json \
            .github/workflows/ci.yml \
            fixture/../src/agent/spec.ts \
            fixture/.github/workflows/ci.yml
          npm run perimeter -- --expect-allowed \
            fixture/src/cart.js \
            fixture/src/cart.test.js

  fixture:
    name: fixture (the service under repair)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fixture
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fixture/package-lock.json

      - run: npm ci

      # The agent's claim is that it turns a red test green without breaking
      # the rest of the suite. This is what checks that claim on its pull
      # request, independently of anything the agent says about itself.
      - run: npm test
